<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Powerpuff Girls Meme Machine</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/lint/lint.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/lint/lint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<style>
  :root {
    --bg: #ffe6f2;
    --panel-bg: #ffd3e8;
    --panel-border: #f7aed2;
    --text: #4a1f3a;
    --text-muted: #9a5c82;
    --btn-bg: #f472b6;
    --btn-bg-hover: #ec4899;
    --btn-text: #fff0f7;
    --error-bg: #ffd0da;
    --error-text: #a3123a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .view {
    display: none;
    min-height: 100vh;
    padding: 2rem 1.5rem;
  }
  .view.active {
    display: flex;
    flex-direction: column;
  }

  /* --- Home / title card --- */
  #home {
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 2rem;
  }
  #home-logo {
    width: 100%;
    max-width: 360px;
  }
  #home .tagline {
    color: var(--text-muted);
    font-weight: 600;
    letter-spacing: 0.02em;
    margin-top: -1.5rem;
  }
  .menu-buttons {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    width: 280px;
  }
  .menu-buttons button {
    font-size: 1.1rem;
    padding: 1rem;
    border-radius: 10px;
    border: none;
    background: var(--btn-bg);
    color: var(--btn-text);
    cursor: pointer;
  }
  .menu-buttons button:hover {
    background: var(--btn-bg-hover);
  }

  /* --- Section shell --- */
  .back-btn {
    align-self: flex-start;
    background: var(--btn-bg);
    color: var(--btn-text);
    border: none;
    padding: 0.5rem 1rem;
    border-radius: 6px;
    cursor: pointer;
    margin-bottom: 1.5rem;
  }
  .back-btn:hover {
    background: var(--btn-bg-hover);
  }
  .section-body {
    max-width: 700px;
    width: 100%;
    margin: 0 auto;
  }

  /* --- Camera sections --- */
  .camera-status {
    margin-bottom: 1rem;
    padding: 0.75rem;
    border-radius: 6px;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
  }
  .camera-status.error {
    background: var(--error-bg);
    color: var(--error-text);
    border-color: var(--error-text);
  }
  #camera-preview-wrap {
    position: relative;
    width: 100%;
    max-width: 640px;
  }
  video, canvas {
    width: 100%;
    display: block;
    border-radius: 8px;
    background: #000;
    transform: scaleX(-1);
  }

  /* --- Mood Meme layout: camera left, meme right --- */
  .mood-section-body {
    max-width: 960px;
  }
  .mood-layout {
    display: flex;
    gap: 1.5rem;
    align-items: stretch;
    flex-wrap: wrap;
  }
  .mood-camera-col {
    flex: 1 1 0;
    min-width: 280px;
  }
  .mood-result-col {
    flex: 1 1 0;
    min-width: 280px;
    display: flex;
  }
  .mood-result {
    position: relative;
    display: flex;
    flex-direction: column;
    text-align: center;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    width: 100%;
    height: 100%;
    min-height: 260px;
    overflow: hidden;
  }
  #mood-result-img {
    flex: 1;
    width: 100%;
    min-height: 0;
    object-fit: cover;
    background: var(--panel-bg);
  }
  .mood-result-text {
    padding: 1rem;
    background: var(--panel-bg);
  }
  #mood-result-name {
    font-size: 1.4rem;
    font-weight: bold;
    text-transform: capitalize;
  }
  .mood-result-score {
    color: var(--text-muted);
    font-size: 0.9rem;
    margin-top: 0.25rem;
  }

  /* --- Python status badge --- */
  #py-status-badge {
    position: fixed;
    top: 0.75rem;
    right: 1rem;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    color: var(--text);
    padding: 0.4rem 0.8rem;
    border-radius: 6px;
    font-size: 0.85rem;
    z-index: 10;
  }
  #py-status-badge.error {
    background: var(--error-bg);
    border-color: var(--error-text);
    color: var(--error-text);
  }

  /* --- Vibe Check Editor --- */
  /* The code editor itself stays dark (standard code-editor convention,
     and rewriting syntax-highlight colors risks readability) — only the
     surrounding chrome picks up the site's pastel pink palette. */
  .editor-wrap {
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    overflow: hidden;
    min-height: 320px;
  }
  .editor-wrap.disabled {
    opacity: 0.5;
    pointer-events: none;
  }
  .CodeMirror {
    height: 320px;
    font-family: "Consolas", "Menlo", monospace;
    background: #1e1e1e;
    color: #d4d4d4;
  }
  .CodeMirror-gutters {
    background: #181818;
    border-right: 1px solid #333;
  }
  .CodeMirror-linenumber {
    color: #666;
    padding: 0 8px 0 12px;
  }
  .CodeMirror pre.CodeMirror-line,
  .CodeMirror pre.CodeMirror-line-like {
    padding: 0 12px;
  }
  .CodeMirror-cursor {
    border-left: 1px solid #eee;
  }
  .CodeMirror-selected {
    background: #3a3d5c !important;
  }
  .cm-keyword { color: #569cd6; }
  .cm-def, .cm-variable-2 { color: #dcdcaa; }
  .cm-string { color: #ce9178; }
  .cm-number { color: #b5cea8; }
  .cm-comment { color: #6a9955; }
  .cm-operator { color: #d4d4d4; }
  #run-btn {
    margin-top: 1rem;
    font-size: 1rem;
    padding: 0.6rem 1.2rem;
    border-radius: 8px;
    border: none;
    background: var(--btn-bg);
    color: var(--btn-text);
    cursor: pointer;
  }
  #run-btn:hover:not(:disabled) {
    background: var(--btn-bg-hover);
  }
  #run-btn:disabled {
    background: var(--panel-border);
    color: var(--text-muted);
    cursor: not-allowed;
  }
  .run-caption {
    display: block;
    margin-top: 0.4rem;
    color: var(--text-muted);
    font-size: 0.8rem;
  }
  #python-output {
    margin-top: 1rem;
    padding: 0.75rem;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    min-height: 3rem;
    white-space: pre-wrap;
    font-family: "Consolas", "Menlo", monospace;
    font-size: 0.9rem;
  }
  #python-output.error { color: var(--error-text); }
  #error-counter {
    display: block;
    margin-top: 1rem;
    color: var(--text-muted);
    font-size: 0.85rem;
  }
</style>
</head>
<body>

<div id="py-status-badge">Python loading…</div>

<!-- Home / title card -->
<div id="home" class="view active">
  <img id="home-logo" src="assets/The_Powerpuff_Girls_logo.svg" alt="The Powerpuff Girls">
  <p class="tagline">sugar, spice, and everything nice</p>
  <div class="menu-buttons">
    <button data-target="section-mood" data-needs-camera>what do you meme?</button>
    <button data-target="section-editor">Are you coding yet?</button>
  </div>
</div>

<!-- Mood Meme -->
<div id="section-mood" class="view">
  <button class="back-btn" data-back>← back</button>
  <div class="section-body mood-section-body">
    <h2>what do you meme?</h2>
    <div class="mood-layout">
      <div class="mood-camera-col">
        <div class="camera-status" id="camera-status-mood"></div>
        <div id="camera-preview-wrap-mood" class="camera-preview-wrap"></div>
        <div class="camera-status" id="mood-status">Loading face/hand detection…</div>
      </div>
      <div class="mood-result-col">
        <div class="mood-result" id="mood-result">
          <img id="mood-result-img" src="" alt="" style="display:none;">
          <div class="mood-result-text">
            <div id="mood-result-name">—</div>
            <div id="mood-result-score" class="mood-result-score"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Vibe Check Editor -->
<div id="section-editor" class="view">
  <button class="back-btn" data-back>← back</button>
  <div class="section-body">
    <h2>Are you coding yet?</h2>
    <div class="editor-wrap disabled" id="editor-wrap">
      <textarea id="python-editor">def greet(name):
    print("hello, " + name)

greet("world")
</textarea>
    </div>
    <button id="run-btn" disabled>Run</button>
    <span class="run-caption">Note: an infinite loop will freeze the tab; reload if that happens.</span>
    <pre id="python-output"></pre>
    <span id="error-counter">syntax errors triggered: 0</span>
  </div>
</div>

<audio id="fahh-audio" src="assets/fahh-sound-effect.mp3" preload="auto"></audio>

<script>
  // --- View switching ---
  const views = document.querySelectorAll('.view');

  function showView(id) {
    views.forEach(v => v.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  document.querySelectorAll('.menu-buttons button').forEach(btn => {
    btn.addEventListener('click', () => {
      showView(btn.dataset.target);
      if (btn.dataset.needsCamera !== undefined) {
        initCamera('camera-status-mood', 'camera-preview-wrap-mood');
      }
      if (btn.dataset.target === 'section-editor') {
        // CodeMirror is created while this section is display:none, so it can't
        // measure the gutter correctly until it's actually visible — refresh here.
        cm.refresh();
      }
      if (btn.dataset.target === 'section-mood') {
        initVision();
      }
    });
  });

  document.querySelectorAll('[data-back]').forEach(btn => {
    btn.addEventListener('click', () => {
      showView('home');
      moodLoopToken++; // stop the mood detection loop when leaving the section
    });
  });

  // --- Shared camera pipeline ---
  // One real <video>/<canvas> pair, moved into whichever section requests it,
  // so we never open two camera streams at once.
  const video = document.createElement('video');
  video.autoplay = true;
  video.muted = true;
  video.playsInline = true;
  video.style.display = 'none';

  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');

  let activeStream = null;
  let drawLoopToken = 0;

  function mountCameraInto(wrapId) {
    const wrap = document.getElementById(wrapId);
    wrap.innerHTML = '';
    wrap.appendChild(video);
    wrap.appendChild(canvas);
  }

  async function initCamera(statusId, wrapId) {
    const statusEl = document.getElementById(statusId);
    mountCameraInto(wrapId);
    statusEl.textContent = 'Requesting camera access…';
    try {
      if (!activeStream) {
        activeStream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = activeStream;
        await new Promise(resolve => {
          video.addEventListener('loadeddata', resolve, { once: true });
        });
      }
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      statusEl.textContent = 'Camera working.';
      drawLoopToken++;
      drawLiveLoop(drawLoopToken);
    } catch (err) {
      statusEl.textContent = 'Camera access needed for this part. (' + err.message + ')';
    }
  }

  function drawLiveLoop(token) {
    if (token !== drawLoopToken) return; // a newer section took over the shared canvas
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    requestAnimationFrame(() => drawLiveLoop(token));
  }

  // --- Vibe Check Editor (Python via Pyodide) ---
  let pyodide = null;
  const statusBadge = document.getElementById('py-status-badge');
  const editorWrap = document.getElementById('editor-wrap');
  const runBtn = document.getElementById('run-btn');
  const outputEl = document.getElementById('python-output');
  const errorCounterEl = document.getElementById('error-counter');
  const fahhAudio = document.getElementById('fahh-audio');

  let errorCount = 0;
  let lastErrorSignature = null; // null = currently valid/incomplete; otherwise "line:col:msg" of the last-fired error
  let hasTyped = false; // becomes true only on a real user edit, not the initial pre-filled snippet

  function setEditorEnabled(enabled) {
    editorWrap.classList.toggle('disabled', !enabled);
    runBtn.disabled = !enabled;
  }

  // Single source of truth for "is this Python valid", shared by the live
  // squiggle (fast, addon-driven) and the sound decision (slow, our own
  // debounce below) — but each of those two consumers owns its own timing
  // and state, so neither can race or double-fire the other.
  //
  // Uses codeop.compile_command (the same check the real interactive
  // interpreter uses) instead of a bare ast.parse, specifically because it
  // distinguishes "incomplete so far, still needs more lines" (e.g. a `for`
  // header with no body yet, an unclosed bracket, an unterminated string —
  // all normal mid-typing states) from an actual syntax error. A bare
  // ast.parse can't tell those apart, which caused the buzzer to fire on
  // completely ordinary in-progress typing of any multi-line construct.
  function checkPythonSyntax(text) {
    if (!pyodide) return { valid: true }; // not ready yet — inert until Pyodide loads

    pyodide.globals.set('code', text);
    pyodide.runPython(`
import codeop
try:
    _compiled = codeop.compile_command(code, '<input>', 'exec')
    result = ('ok', None, None, None) if _compiled is not None else ('incomplete', None, None, None)
except SyntaxError as e:
    result = ('error', e.lineno, e.offset, str(e.msg))
except (ValueError, OverflowError) as e:
    result = ('error', None, None, str(e))
`);

    // Python -> JS hand-off, with explicit PyProxy cleanup (pyodide stays
    // open for the whole pre-load-and-wait window, so every check must
    // clean up its own proxy or it leaks for as long as the tab is open).
    const resultProxy = pyodide.globals.get('result');
    let result = null;
    if (resultProxy && typeof resultProxy.toJs === 'function') {
      result = resultProxy.toJs();
      resultProxy.destroy();
    }

    const [status, lineno, offset, msg] = result;
    // 'incomplete' (still typing a block/bracket/string) counts as valid —
    // it's not a mistake, just not finished yet.
    if (status !== 'error') return { valid: true };
    return { valid: false, lineno, offset, msg };
  }

  CodeMirror.registerHelper('lint', 'python', function (text) {
    const check = checkPythonSyntax(text);
    if (check.valid) return [];

    // offset can legitimately be None (e.g. unexpected EOF, unterminated
    // string) — default to column 0 instead of producing NaN.
    const col = (check.offset === null || check.offset === undefined) ? 0 : Math.max(0, check.offset - 1);
    const line = Math.max(0, (check.lineno || 1) - 1); // CodeMirror is 0-indexed

    return [{
      from: CodeMirror.Pos(line, col),
      to: CodeMirror.Pos(line, col + 1),
      message: check.msg,
      severity: 'error',
    }];
  });

  const cm = CodeMirror.fromTextArea(document.getElementById('python-editor'), {
    mode: 'python',
    lineNumbers: true,
    gutters: ['CodeMirror-linenumbers', 'CodeMirror-lint-markers'],
    lint: { delay: 300 },
    autoCloseBrackets: true,
  });

  // Sound trigger: only decided after you've paused typing for a bit, so it
  // doesn't fire mid-keystroke while you're still finishing a line. This is
  // deliberately a longer, separate debounce from the live squiggle above.
  const SOUND_SETTLE_MS = 1500;
  let soundTimer = null;

  cm.on('change', (instance, change) => {
    if (change.origin !== 'setValue') hasTyped = true;

    clearTimeout(soundTimer);
    soundTimer = setTimeout(() => {
      if (!hasTyped) return;
      const check = checkPythonSyntax(cm.getValue());
      if (check.valid) {
        lastErrorSignature = null;
        return;
      }
      // Fire on every genuinely new error — not just the first valid->invalid
      // flip — but not repeatedly for the exact same error sitting unchanged.
      const signature = `${check.lineno}:${check.offset}:${check.msg}`;
      if (signature !== lastErrorSignature) {
        lastErrorSignature = signature;
        errorCount++;
        errorCounterEl.textContent = `syntax errors triggered: ${errorCount}`;
        fahhAudio.currentTime = 0;
        fahhAudio.play();
      }
    }, SOUND_SETTLE_MS);
  });

  async function runCode() {
    const code = cm.getValue();
    runBtn.disabled = true;
    runBtn.textContent = 'Running…';
    outputEl.textContent = '';
    outputEl.classList.remove('error');
    pyodide.setStdout({ batched: (s) => { outputEl.textContent += s + '\n'; } });
    pyodide.setStderr({ batched: (s) => { outputEl.textContent += s + '\n'; } });
    try {
      await pyodide.runPythonAsync(code);
    } catch (err) {
      outputEl.classList.add('error');
      outputEl.textContent += err.message; // Pyodide's message already contains the real traceback
    } finally {
      runBtn.disabled = false;
      runBtn.textContent = 'Run';
    }
  }

  runBtn.addEventListener('click', runCode);

  async function bootPyodide() {
    if (typeof loadPyodide !== 'function') {
      // the CDN <script> tag itself failed to load
      statusBadge.textContent = 'Python failed to load — reload the page';
      statusBadge.classList.add('error');
      return;
    }
    try {
      pyodide = await loadPyodide();
      statusBadge.textContent = 'Python ready ✓';
      setEditorEnabled(true);
      cm.setOption('lint', { delay: 300 }); // re-trigger an initial lint pass now that pyodide is ready
    } catch (err) {
      statusBadge.textContent = 'Python failed to load — reload the page';
      statusBadge.classList.add('error');
    }
  }
  bootPyodide();

  // --- Mood Meme (face/hand expression matching) ---
  const EPS = 1e-6;
  // Was 1.3 — confirmed too loose live (hands joined at chest registered as
  // "near face"). Tightened to require genuine chin/mouth proximity.
  const HAND_NEAR_THRESHOLD = 0.6; // multiples of interocular distance

  let faceLandmarker = null, handLandmarker = null, visionReady = false;
  const moodStatusEl = document.getElementById('mood-status');
  const moodResultImg = document.getElementById('mood-result-img');
  const moodResultName = document.getElementById('mood-result-name');
  const moodResultScore = document.getElementById('mood-result-score');

  let moodLoopToken = 0;
  let lastVideoTime = -1;

  async function initVision() {
    if (visionReady || moodStatusEl.dataset.failed) return;
    moodStatusEl.textContent = 'Loading face/hand detection…';
    moodStatusEl.classList.remove('error');
    try {
      const { FaceLandmarker, HandLandmarker, FilesetResolver } =
        await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1');

      const vision = await FilesetResolver.forVisionTasks(
        'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm'
      );

      async function createLandmarker(Ctor, modelUrl, extraOpts) {
        try {
          return await Ctor.createFromOptions(vision, {
            baseOptions: { modelAssetPath: modelUrl, delegate: 'GPU' },
            runningMode: 'VIDEO',
            ...extraOpts,
          });
        } catch (err) {
          // GPU delegate can fail on some machines/browsers — fall back to CPU once.
          return await Ctor.createFromOptions(vision, {
            baseOptions: { modelAssetPath: modelUrl, delegate: 'CPU' },
            runningMode: 'VIDEO',
            ...extraOpts,
          });
        }
      }

      faceLandmarker = await createLandmarker(FaceLandmarker,
        'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
        { numFaces: 1, outputFaceBlendshapes: false });
      handLandmarker = await createLandmarker(HandLandmarker,
        'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
        { numHands: 2 });

      visionReady = true;
      moodStatusEl.textContent = 'Ready';
      moodLoopToken++;
      // Scheduled via rAF rather than called directly, so a runtime error on
      // the first detected frame (e.g. the camera stream not fully ready
      // yet) can't bubble up into this function's own try/catch and get
      // misreported as a model-loading failure.
      requestAnimationFrame(() => moodLoop(moodLoopToken));
    } catch (err) {
      console.error('initVision failed:', err);
      moodStatusEl.textContent = 'Failed to load face detection — reload the page (' + err.message + ')';
      moodStatusEl.dataset.failed = 'true';
      moodStatusEl.classList.add('error');
    }
  }

  function moodLoop(token) {
    if (token !== moodLoopToken || !visionReady) return;
    // The camera stream may not have a real frame yet (permission still
    // settling, or the video briefly reports 0x0) — detectForVideo throws on
    // a zero-size frame, so skip until the video actually has dimensions.
    if (video.videoWidth > 0 && video.videoHeight > 0 && video.currentTime !== lastVideoTime) {
      lastVideoTime = video.currentTime;
      try {
        const nowMs = performance.now();
        const faceResult = faceLandmarker.detectForVideo(video, nowMs);
        const handResult = handLandmarker.detectForVideo(video, nowMs);
        // FaceLandmarkerResult uses `.faceLandmarks`; HandLandmarkerResult uses
        // plain `.landmarks` (not `.handLandmarks`) — verified against the API.
        const face = faceResult.faceLandmarks[0];
        const hands = handResult.landmarks;
        if (face) {
          const features = computeFeatures(face, hands);
          updateMoodMatch(features);
        }
      } catch (err) {
        console.error('mood frame detection failed:', err);
      }
    }
    requestAnimationFrame(() => moodLoop(token));
  }

  function dist(a, b) {
    return Math.hypot(a.x - b.x, a.y - b.y);
  }

  const RIGHT_EYE = [33, 160, 158, 133, 153, 144];   // [outer, upper1, upper2, inner, lower2, lower1]
  const LEFT_EYE = [362, 385, 387, 263, 373, 380];
  const LEFT_EYEBROW = [70, 63, 105, 66, 107];
  const RIGHT_EYEBROW = [300, 293, 334, 296, 336];
  const FINGERTIPS = [4, 8, 12, 16, 20];

  function ear(lm, idx) {
    const [outer, u1, u2, inner, l2, l1] = idx.map(i => lm[i]);
    return (dist(u1, l1) + dist(u2, l2)) / (2 * dist(outer, inner) + EPS);
  }

  function meanY(lm, idx) {
    return idx.reduce((sum, i) => sum + lm[i].y, 0) / idx.length;
  }

  function computeFeatures(face, hands) {
    const leftEAR = ear(face, LEFT_EYE);
    const rightEAR = ear(face, RIGHT_EYE);
    const eye_openness = (leftEAR + rightEAR) / 2;
    const eyes_symmetry = Math.abs(leftEAR - rightEAR);

    const mouth_openness = dist(face[13], face[14]) / (dist(face[61], face[291]) + EPS);
    const mouth_width_ratio = dist(face[78], face[308]) / (dist(face[61], face[291]) + EPS);

    const interocular = dist(face[33], face[263]) + EPS;

    const leftBrowRaise = meanY(face, LEFT_EYE) - meanY(face, LEFT_EYEBROW);
    const rightBrowRaise = meanY(face, RIGHT_EYE) - meanY(face, RIGHT_EYEBROW);
    const eyebrow_height = ((leftBrowRaise + rightBrowRaise) / 2) / interocular;
    const brow_symmetry = Math.abs(leftBrowRaise - rightBrowRaise) / interocular;

    const mouthCenter = {
      x: (face[61].x + face[291].x + face[13].x + face[14].x) / 4,
      y: (face[61].y + face[291].y + face[13].y + face[14].y) / 4,
    };
    const mouth_elevation = (face[4].y - mouthCenter.y) / interocular;

    const num_hands = hands.length;
    const faceTopY = Math.min(...face.map(p => p.y));
    const chin = face[152];
    // "Raised" means at or above roughly mid-face height (eye level) — not
    // literally above the top of your head, which was too strict a bar for
    // a normal flex/finger-up gesture and meant hand_raised almost never
    // fired.
    const raisedThresholdY = faceTopY + 0.5 * (chin.y - faceTopY);
    let hand_raised = 0, hand_near_face = 0;
    for (const hand of hands) {
      if (hand[0].y < raisedThresholdY || hand[12].y < raisedThresholdY) hand_raised = 1;
      for (const tipIdx of FINGERTIPS) {
        const tip = hand[tipIdx];
        if (dist(tip, chin) < HAND_NEAR_THRESHOLD * interocular ||
            dist(tip, mouthCenter) < HAND_NEAR_THRESHOLD * interocular) {
          hand_near_face = 1;
        }
      }
    }

    // mouth_width_ratio (inner/outer mouth width) barely moves when you
    // smile — confirmed live (0.906 at rest, essentially the same while
    // smiling), since smiling stretches the whole mouth outward rather than
    // changing that inner/outer proportion. Smiling instead widens the
    // mouth-corner span relative to the face — measure that against the
    // interocular scale unit instead.
    const mouth_span = dist(face[61], face[291]) / interocular;
    const surprise_score = eye_openness * mouth_openness;
    const smile_score = mouth_span * (1 - mouth_openness);

    return {
      eye_openness, eyes_symmetry, mouth_openness, mouth_width_ratio, mouth_span,
      eyebrow_height, brow_symmetry, mouth_elevation,
      num_hands, hand_raised, hand_near_face,
      surprise_score, smile_score,
    };
  }

  // Recalibrated against real measured values (neutral face: eye_openness
  // 0.444, mouth_openness 0.013, eyebrow_height 0.350) — the original
  // targets were guessed blind and were badly off-scale (e.g. "shocked"
  // eye_openness was set lower than a normal resting eye actually measures).
  const MOOD_TARGETS = [
    { name: 'praying', img: 'assets/praying_monkey.jpg',
      hint: 'eyes closed + calm mouth + hands together, not raised',
      target: { eye_openness: 0.15, mouth_openness: 0.05, hand_raised: 0, hand_near_face: 0 } },
    { name: 'unbothered', img: 'assets/unbothered_lion_chimp.jpg',
      hint: 'neutral/calm face + hand near chin',
      target: { eye_openness: 0.42, mouth_openness: 0.08, hand_raised: 0, hand_near_face: 1 } },
    { name: 'shocked', img: 'assets/shocked_monkey.jpg',
      hint: 'mouth wide open + eyes wide + hands near chest',
      target: { eye_openness: 0.55, mouth_openness: 0.4, hand_raised: 0, hand_near_face: 0 } },
    { name: 'flex / pointing', img: 'assets/flex_pointing_monkey.jpg',
      hint: 'big smile, teeth showing + one hand raised, finger up',
      target: { smile_score: 0.6, mouth_openness: 0.08, hand_raised: 1 } },
  ];

  // eyes_symmetry/eyebrow_height dropped — only used by wink-smirk/pondering,
  // cut from MOOD_TARGETS below (see plan.md Phase 2 deviation note).
  const FEATURE_WEIGHTS = {
    eye_openness: 1, mouth_openness: 1, mouth_width_ratio: 1,
    hand_raised: 1, hand_near_face: 1,
    smile_score: 1, surprise_score: 0,
    num_hands: 0, mouth_elevation: 0, brow_symmetry: 0,
  };
  // Continuous features get a much sharper factor than binary ones. At
  // factor=1, a 0/1 binary mismatch (exp(-1)=0.37) swung the score far more
  // than a real expression difference on a 0-0.5-ish continuous feature
  // (exp(-0.3)=0.74) — so hand position was overpowering facial expression
  // entirely. Binary features are already maximally sharp at factor=1 (their
  // only possible distances are 0 or 1), so they're left alone.
  const FEATURE_FACTORS = {
    default: 1,
    eye_openness: 4, mouth_openness: 4, mouth_width_ratio: 4, smile_score: 4,
  };

  // "hands not raised"/"hands not near face" (target value 0) can't actually
  // be confirmed when no hands are visible at all — that's a missing
  // observation, not a match. Skipping those two keys in that case (instead
  // of scoring them as a free perfect match) stops a plain neutral face
  // with hands out of frame from trivially satisfying praying/shocked's
  // hand_raised=0 + hand_near_face=0 targets. A target value of 1 (flex's
  // hand_raised, unbothered/wink's hand_near_face) is left alone — those
  // already correctly score low when no hands are present, since "hand
  // required but absent" is a real mismatch.
  const HAND_KEYS = new Set(['hand_raised', 'hand_near_face']);

  function computeSimilarity(features, target) {
    let score = 0, count = 0;
    for (const key of Object.keys(target)) {
      if (HAND_KEYS.has(key) && features.num_hands === 0 && target[key] === 0) continue;
      const w = FEATURE_WEIGHTS[key] ?? 0;
      const factor = FEATURE_FACTORS[key] ?? FEATURE_FACTORS.default;
      score += w * Math.exp(-Math.abs(features[key] - target[key]) * factor);
      count++;
    }
    return { score, count };
  }

  // Score normalized to a 0-1 "confidence" (raw score / number of keys
  // actually evaluated this frame — see HAND_KEYS above for why that count
  // can vary) so memes with different key counts are comparable, and so we
  // can require a minimum confidence before showing any match at all.
  const MATCH_CONFIDENCE_THRESHOLD = 0.65;

  function findBestMatch(features) {
    // Compare by confidence (normalized), not raw summed score — targets
    // have different numbers of keys, so raw score structurally favors
    // targets with more keys regardless of how well the pose matches.
    let best = null, bestScore = -Infinity, bestConfidence = -Infinity;
    for (const entry of MOOD_TARGETS) {
      const { score, count } = computeSimilarity(features, entry.target);
      const confidence = score / count;
      if (confidence > bestConfidence) { bestScore = score; best = entry; bestConfidence = confidence; }
    }
    if (bestConfidence < MATCH_CONFIDENCE_THRESHOLD) {
      return { best: null, score: bestScore, confidence: bestConfidence };
    }
    return { best, score: bestScore, confidence: bestConfidence };
  }

  const MOOD_HOLD_MS = 500;
  let pendingMatchName = null;
  let pendingMatchSince = 0;
  let displayedMatchName = null;

  function updateMoodMatch(features) {
    const { best, score, confidence } = findBestMatch(features);

    const now = performance.now();
    const matchName = best ? best.name : null; // null = no confident match this frame

    if (matchName !== pendingMatchName) {
      pendingMatchName = matchName;
      pendingMatchSince = now;
    }

    if (matchName !== displayedMatchName && (now - pendingMatchSince) >= MOOD_HOLD_MS) {
      displayedMatchName = matchName;
      if (best) {
        moodResultImg.src = best.img;
        moodResultImg.style.display = 'block';
        moodResultName.textContent = best.name;
      } else {
        moodResultImg.style.display = 'none';
        moodResultName.textContent = '— no clear match —';
        moodResultScore.textContent = '';
      }
    }
    if (best && displayedMatchName === best.name) {
      moodResultScore.textContent = `match score: ${score.toFixed(3)} (confidence ${confidence.toFixed(3)})`;
    }
  }

  // Applies the pose measurements captured earlier via the (now-removed)
  // calibration flow, still saved in localStorage from that session — see
  // plan.md Phase 2 notes. Only overwrites the target *values* already in
  // MOOD_TARGETS; falls back to the hard-coded defaults if nothing's saved.
  const CALIB_STORAGE_KEY = 'moodMemeCalibration';

  function loadCalibration() {
    try {
      const raw = localStorage.getItem(CALIB_STORAGE_KEY);
      if (!raw) return;
      const saved = JSON.parse(raw);
      for (const entry of MOOD_TARGETS) {
        if (saved[entry.name]) Object.assign(entry.target, saved[entry.name]);
      }
    } catch (err) {
      console.error('failed to load saved calibration:', err);
    }
  }

  loadCalibration();
</script>
